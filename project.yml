name: Rumen
options:
  bundleIdPrefix: com.moomoomoo
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

# Regenerate the .xcodeproj (which is gitignored) with `xcodegen generate`.
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Local dev signs ad-hoc so no Apple Team is required to build/run.
    # scripts/release.sh signs the Release build with Developer ID + hardened runtime and notarizes it (M9).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  RumenCore:
    path: .

targets:
  Rumen:
    type: application
    platform: macOS
    sources:
      - Sources/App
      - path: Resources/Fonts
        buildPhase: resources
      # Icon Composer bundle (Liquid Glass icon; actool renders every size from it).
      # Design source: design/icon/concepts.mjs, exported by design/icon/export-app-icon.mjs.
      - path: Resources/AppIcon/AppIcon.icon
        buildPhase: resources
        type: file
    dependencies:
      - package: RumenCore
        product: DuckDBKit
      - package: RumenCore
        product: RumenKit
    # MapTiler key comes from Config/maptiler.xcconfig (+ untracked …local.xcconfig); no key
    # is committed. It flows MAPTILER_API_KEY → Info.plist MapTilerAPIKey → MapConfig (M6).
    configFiles:
      Debug: Config/maptiler.xcconfig
      Release: Config/maptiler.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moomoomoo.Rumen
        PRODUCT_NAME: Rumen
        # Manual Info.plist (not generated) so the custom MapTilerAPIKey key can be filled by
        # build-setting substitution from $(MAPTILER_API_KEY).
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # libduckdb is linked from Homebrew (absolute install name) in dev; scripts/bundle-duckdb-engine.sh
        # copies it into the bundle and rewrites the reference for release.
        LIBRARY_SEARCH_PATHS:
          - "/opt/homebrew/opt/duckdb/lib"
        LD_RUNPATH_SEARCH_PATHS:
          - "/opt/homebrew/opt/duckdb/lib"
        # The engine (Homebrew libduckdb, bundled by the release script) is arm64 only, so the
        # app is too: a Release build otherwise builds both standard slices and the x86_64 one
        # cannot link.
        ARCHS: arm64

  # Apple's accessibility audit and a launch-time metric, driven through XCUITest against a
  # scratch home (`--home`) and a loopback ArcGIS server the tests synthesise. Run with
  # claude-scripts/ui_test.sh or from Xcode.
  RumenUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/RumenUITests
      # The palette test reads the tokens from the code and the design doc; carried in the
      # bundle so the test also runs on a Mac that has no checkout. Xcode will not copy a
      # Swift source as a resource, so the script below carries it as Theme.txt.
      - path: DESIGN-TOKENS.md
        buildPhase: resources
    postCompileScripts:
      - name: Carry Theme.swift as Theme.txt
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          cp "$SRCROOT/Sources/App/Theme.swift" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Theme.txt"
        inputFiles:
          - $(SRCROOT)/Sources/App/Theme.swift
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Theme.txt
    dependencies:
      - target: Rumen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moomoomoo.RumenUITests
        GENERATE_INFOPLIST_FILE: YES
        # The runner is sandboxed by Xcode; the tests' loopback server needs the network server side.
        CODE_SIGN_ENTITLEMENTS: Config/RumenUITests.entitlements

schemes:
  Rumen:
    build:
      targets:
        Rumen: all
        RumenUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RumenUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
